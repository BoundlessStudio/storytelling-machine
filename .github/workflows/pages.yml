name: Build and deploy story library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build site
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://boundlessstudio.github.io' }}
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH || '/storytelling-machine/' }}
          MEDIA_ORIGIN: ${{ vars.MEDIA_ORIGIN || 'https://art.rgbknights.com' }}
        run: >-
          python scripts/build.py --output _site
          --site-url "$SITE_ORIGIN" --base-path "$SITE_BASE_PATH"
          --media-url "$MEDIA_ORIGIN"
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
